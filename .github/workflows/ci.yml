name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    # Explicit shell turns on pipefail, so `cmd | tee` can't mask a failing cmd.
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Deployments are owned by Cloudflare Workers Builds (scripts/cf-ci.sh). This workflow is the quality gate:
# make these jobs required status checks on `main` so nothing unverified reaches the production branch.
env:
  NODE_VERSION: 22
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  quality:
    name: Typecheck & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - name: Generate Next route types
        run: npx next typegen
      - run: npm run typecheck
      - run: npx eslint --max-warnings=0 .
      - name: Drizzle schema ↔ migrations in sync
        run: |
          npx drizzle-kit generate --name ci-drift-check
          git diff --exit-code --stat drizzle/ || (echo "::error::Schema changed without a migration. Run npm run db:generate and commit." && exit 1)

  e2e:
    name: Playwright (EN + AR, 3 viewports)
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  worker-smoke:
    name: Worker smoke (D1 · KV · DO · rate limits)
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npm run cf:build
      - run: scripts/smoke.sh
