version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      # One PR per week for all non-breaking updates; majors arrive individually for deliberate review.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Migrations, not bumps: Tailwind 4 rewrites config/CSS; TypeScript 7 is the native compiler port.
      - dependency-name: tailwindcss
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions:
        patterns: ['*']
