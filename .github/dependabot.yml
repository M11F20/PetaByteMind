version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      cloudflare: { patterns: ['wrangler', '@opennextjs/*', '@cloudflare/*'] }
      next-react: { patterns: ['next', 'react', 'react-dom', 'eslint-config-next', '@types/react*'] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
